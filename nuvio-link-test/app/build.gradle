plugins { id 'com.android.application' }
android {
    namespace 'tv.gallery.nuviotest'
    compileSdk 34
    defaultConfig {
        applicationId 'tv.gallery.nuviotest'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
